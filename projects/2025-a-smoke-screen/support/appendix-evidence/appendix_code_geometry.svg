<text x="40" y="639" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 684  def merge_intervals(</text>
<text x="40" y="657" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 685      intervals: Iterable[tuple[float, float]], *, tolerance: float = 1e-10</text>
<text x="40" y="675" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 686  ) -&gt; list[tuple[float, float]]:</text>
<text x="40" y="693" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 687      &quot;&quot;&quot;Return the union of time intervals without double-counting overlaps.&quot;&quot;&quot;</text>
<text x="40" y="711" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 688  </text>
<text x="40" y="729" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 689      ordered = sorted((float(left), float(right)) for left, right in intervals)</text>
<text x="40" y="747" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 690      merged: list[list[float]] = []</text>
<text x="40" y="765" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 691      for left, right in ordered:</text>
<text x="40" y="783" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 692          if right &lt; left:</text>
<text x="40" y="801" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 693              raise ValueError(&quot;interval right endpoint precedes left endpoint&quot;)</text>
<text x="40" y="819" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 694          if not merged or left &gt; merged[-1][1] + tolerance:</text>
<text x="40" y="837" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 695              merged.append([left, right])</text>
<text x="40" y="855" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 696          else:</text>
<text x="40" y="873" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 697              merged[-1][1] = max(merged[-1][1], right)</text>
<text x="40" y="891" font-family="Consolas, monospace" font-size="14" fill="#111111" xml:space="preserve"> 698      return [(left, right) for left, right in merged if right - left &gt; tolerance]</text>
